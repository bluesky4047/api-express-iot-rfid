<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masuk · Smart Door</title>
<style>
  :root{--bg:#0b0f17;--panel:#121826;--border:#1f2937;--text:#e5e7eb;--muted:#94a3b8;--accent:#6366f1;--bad:#ef4444}
  @media (prefers-color-scheme:light){:root{--bg:#f3f4f8;--panel:#fff;--border:#e2e5ec;--text:#111827;--muted:#64748b}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:
    radial-gradient(900px 500px at 15% -10%,rgba(99,102,241,.25),transparent),
    radial-gradient(700px 400px at 100% 110%,rgba(34,197,94,.14),transparent),var(--bg);
    color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;padding:20px}
  .card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:32px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .logo{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:grid;place-items:center;margin-bottom:18px}
  h1{margin:0 0 4px;font-size:22px}
  p{margin:0 0 22px;color:var(--muted);font-size:14px}
  label{display:block;font-size:12px;color:var(--muted);margin:14px 0 6px;font-weight:600}
  input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:transparent;color:var(--text);font-size:15px;outline:none}
  input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,102,241,.25)}
  button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:600;font-size:15px;cursor:pointer}
  button:hover{filter:brightness(1.1)}
  .err{display:none;margin-top:16px;padding:10px 12px;border-radius:10px;background:rgba(239,68,68,.12);color:var(--bad);font-size:13px}
</style>
</head>
<body>
<form class="card" method="POST" action="/login">
  <div class="logo">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
  </div>
  <h1>Smart Door</h1>
  <p>Masuk untuk mengelola akses pintu.</p>
  <label for="u">Username</label>
  <input id="u" name="username" autocomplete="username" required autofocus>
  <label for="p">Password</label>
  <input id="p" name="password" type="password" autocomplete="current-password" required>
  <button type="submit">Masuk</button>
  <div class="err" id="err"></div>
</form>
<script>
  const e = new URLSearchParams(location.search).get("error");
  if (e) {
    const el = document.getElementById("err");
    el.style.display = "block";
    el.textContent = e === "limit" ? "Terlalu banyak percobaan. Coba lagi dalam 15 menit." : "Username atau password salah.";
  }
</script>
</body>
</html>
